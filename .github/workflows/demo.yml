name: Deploy website
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4 #uploading an artifact
        with:
          name: web-build
          path: dist/          # folder produced by build
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4 #action to download an artifact
        with:
          name: web-build
          path: ./dist
      - name: Deploy
        run: ./deploy.sh ./dist